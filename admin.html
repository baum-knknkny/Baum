<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>管理画面</title>

    <link rel="stylesheet"
        href="css/style.css">
</head>

<body>

    <h1>小説管理画面</h1>

    <section>

        <h2>作品</h2>

        <select id="series">

            <option value="novel-a">
                作品A
            </option>

            <option value="novel-b">
                作品B
            </option>

            <option value="short">
                短編
            </option>

        </select>

    </section>

    <section>

        <h2>章番号</h2>

        <input
            id="chapter"
            type="number"
            min="0">

    </section>

    <section>

        <h2>章タイトル</h2>

        <input
            id="chapterName"
            type="text">

    </section>

    <section>

        <h2>話数</h2>

        <input
            id="storyNumber"
            type="number"
            min="1">

    </section>

    <section>

        <h2>タイトル</h2>

        <input
            id="title"
            type="text">

    </section>

    <section>

        <h2>本文</h2>

        <textarea
            id="body"
            rows="20"></textarea>

    </section>

    <br>

    <button onclick="generateMarkdown()">
        Markdown生成
    </button>

    <hr>

    <h2>生成結果</h2>

    <textarea
        id="result"
        rows="25"
        readonly></textarea>

    <br>

    <button onclick="copyMarkdown()">
        コピー
    </button>

    <p id="filename"></p>

    <script src="js/admin.js"></script>

</body>

</html>
