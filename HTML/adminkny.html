<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>管理画面</title>

    <link rel="stylesheet"
        href="../CSS/Style.css">
</head>

<body>
    
    
<button onclick="saveTest()">

    Test2ファイル作成

</button>

    <h2>小説管理画面</h2>

    <section>

        <h3>作品</h3>

        <select id="series">

            <option value="novel-a">
                叶うなら
            </option>

            <option value="novel-b">
                白百合のそばで
            </option>

            <option value="short">
                短編
            </option>

        </select>

    </section>

    <section>

        <h3>章番号</h3>

        <input
            id="chapter"
            type="number"
            min="0">

    </section>

    <section>

        <h3>章タイトル</h3>

        <input
            id="chapterName"
            type="text">

    </section>

    <section>

        <h3>話数</h3>

        <input
            id="episode"
            type="number"
            min="1">

    </section>

    <section>

        <h3>タイトル</h3>

        <input
            id="title"
            type="text">

    </section>
<section>

        <h3>要約</h3>

        <input
            id="summary"
            type="text" >

    </section>
    <section>

        <h3>本文</h3>

        <textarea
            id="body"
            class="admin"></textarea>

    </section>

    <br>

    <button onclick="saveStory()">
        ストーリー保存
    </button>

    <hr>

    <h3>生成結果(Markdown)</h3>

    <textarea
        id="result"
        class="admin"

        readonly></textarea>

    <br>

    <button onclick="copyMarkdown()">
        コピー
    </button>
        <p id="filename"></p>

<br><br>
    <h3>生成結果（JavaScript）</h3>
    <textarea
        id="resultJs"
class="admin"
        readonly></textarea>

    <br>
    <button onclick="copyJs()">
    コピー
    </button>


    <p id="filename"></p>

    <script src="../js/content/storyA.js"></script>
    <script src="../js/content/storyB.js"></script>
    <script src="../js/content/storyShort.js"></script>
    <script src="../js/adminkny.js"></script>

</body>

</html>
